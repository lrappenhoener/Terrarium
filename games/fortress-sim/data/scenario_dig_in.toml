# Seed 42, default 96x96x32 world. Residents arrive on the plain west of the
# mountain (standing level z=14), tunnel east at y=47..49, sink a stair shaft at
# (40,48) from z=14 down to z=2 and dig rooms on several levels.

[[schedule]]
tick = 0
commands = [
    { DesignateStockpile = { from = { x = 1, y = 24, z = 14 }, to = { x = 12, y = 43, z = 14 } } },
    { DesignateDig = { from = { x = 14, y = 47, z = 14 }, to = { x = 39, y = 49, z = 14 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 22, y = 42, z = 14 }, to = { x = 30, y = 46, z = 14 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 22, y = 50, z = 14 }, to = { x = 30, y = 54, z = 14 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 14 }, to = { x = 40, y = 48, z = 14 }, mode = "StairDown" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 3 }, to = { x = 40, y = 48, z = 13 }, mode = "StairUpDown" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 2 }, to = { x = 40, y = 48, z = 2 }, mode = "StairUp" } },
    { DesignateDig = { from = { x = 41, y = 45, z = 11 }, to = { x = 46, y = 51, z = 11 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 41, y = 42, z = 8 }, to = { x = 52, y = 54, z = 8 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 34, y = 45, z = 5 }, to = { x = 39, y = 51, z = 5 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 41, y = 45, z = 2 }, to = { x = 46, y = 51, z = 2 }, mode = "Dig" } },
    # Rejected on purpose: digging in open air and outside the world.
    { DesignateDig = { from = { x = 2, y = 2, z = 20 }, to = { x = 3, y = 2, z = 20 }, mode = "Dig" } },
    { Build = { pos = { x = 500, y = 0, z = 0 }, kind = "Wall" } },
]

[[schedule]]
tick = 3000
commands = [
    { DesignateStockpile = { from = { x = 22, y = 42, z = 14 }, to = { x = 30, y = 46, z = 14 } } },
    { Build = { pos = { x = 16, y = 47, z = 14 }, kind = "Wall" } },
    { Build = { pos = { x = 16, y = 48, z = 14 }, kind = "Door" } },
    { Build = { pos = { x = 16, y = 49, z = 14 }, kind = "Wall" } },
]

[[schedule]]
tick = 5000
commands = [{ SpawnResidents = { count = 10 } }]

[[schedule]]
tick = 9000
commands = [
    { DesignateStockpile = { from = { x = 41, y = 42, z = 8 }, to = { x = 52, y = 47, z = 8 } } },
    { Build = { pos = { x = 44, y = 45, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 44, y = 46, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 44, y = 47, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 44, y = 48, z = 11 }, kind = "Door" } },
    { Build = { pos = { x = 44, y = 49, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 44, y = 50, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 44, y = 51, z = 11 }, kind = "Wall" } },
    { Build = { pos = { x = 38, y = 48, z = 5 }, kind = "Door" } },
]

