# Seed 42, default world. Residents dig in as in scenario_dig_in.toml, then a
# gallery at z=10 east of the shaft cuts into the water-bearing sandstone around
# (60,40,9..10). Water runs back to the shaft, falls down the stairs and floods
# the deep levels; residents flee.

[[schedule]]
tick = 0
commands = [
    { DesignateStockpile = { from = { x = 1, y = 24, z = 14 }, to = { x = 12, y = 43, z = 14 } } },
    { DesignateDig = { from = { x = 14, y = 47, z = 14 }, to = { x = 39, y = 49, z = 14 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 14 }, to = { x = 40, y = 48, z = 14 }, mode = "StairDown" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 3 }, to = { x = 40, y = 48, z = 13 }, mode = "StairUpDown" } },
    { DesignateDig = { from = { x = 40, y = 48, z = 2 }, to = { x = 40, y = 48, z = 2 }, mode = "StairUp" } },
    { DesignateDig = { from = { x = 41, y = 45, z = 2 }, to = { x = 52, y = 51, z = 2 }, mode = "Dig" } },
    { DesignateDig = { from = { x = 41, y = 45, z = 5 }, to = { x = 48, y = 51, z = 5 }, mode = "Dig" } },
]

[[schedule]]
tick = 1500
commands = [
    { DesignateDig = { from = { x = 41, y = 48, z = 10 }, to = { x = 60, y = 48, z = 10 }, mode = "Dig" } },
]
