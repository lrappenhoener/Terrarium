# Recipes. Inputs name a category or an item kind and an amount; `fuel` adds that
# many units of the fuel category. Products take the material of input
# `material_of` (default 0), its smelting product with `smelted = true`, or a
# fixed `material`. `work_ticks` shrink with the worker's skill level.

[[recipe]]
id = "burn_charcoal"
workshop = "kiln"
skill = "charcoal_burning"
work_ticks = 60
inputs = [{ category = "log", amount = 1 }]
outputs = [{ item = "charcoal", amount = 3 }]

