[workspace]
members = ["crates/sim-core", "crates/sim-host", "crates/sim-runner", "games/dummy-sim"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.9", features = ["derive"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
sim-host = { path = "crates/sim-host" }
sim-core = { path = "crates/sim-core" }
dummy-sim = { path = "games/dummy-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
