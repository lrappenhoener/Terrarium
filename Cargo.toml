[workspace]
members = ["apps/fortress-viewer", "crates/sim-core", "crates/sim-host", "crates/sim-io", "crates/sim-runner", "games/dummy-sim", "games/fortress-sim", "games/jungle-sim"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
allocation-counter = "0.8.1"
clap = { version = "4.6.9", features = ["derive"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
sim-host = { path = "crates/sim-host" }
sim-core = { path = "crates/sim-core" }
dummy-sim = { path = "games/dummy-sim" }
jungle-sim = { path = "games/jungle-sim" }
sim-io = { path = "crates/sim-io" }
fortress-sim = { path = "games/fortress-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2

[profile.release-checked]
inherits = "release"
overflow-checks = true
